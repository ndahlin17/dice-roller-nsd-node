<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller API Tester</title>
</head>

<body>

    <h1>Dice Roller Web Service API</h1>

    <p>This page tests the RESTful APIs provided by the Node.js server.</p>

    <button onclick="wakeServer()">Wake Server</button>
    <button onclick="rollDie()">Roll One Die</button>

    <p id="result"></p>

    <script>
        const serverUrl = '';

        async function wakeServer() {
            try {
                const response = await fetch(serverUrl + '/api/wake');
                const data = await response.json();

                document.getElementById('result').textContent = data.message;
            } catch (error) {
                document.getElementById('result').textContent =
                    'Error connecting to server.';
            }
        }

        async function rollDie() {
            try {
                const response = await fetch(serverUrl + '/api/roll');
                const data = await response.json();

                document.getElementById('result').textContent =
                    'The server rolled: ' + data.roll;
            } catch (error) {
                document.getElementById('result').textContent =
                    'Error connecting to server.';
            }
        }
    </script>

</body>
</html>
